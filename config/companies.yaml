# Companies to scan. Each entry: name, ats (greenhouse|lever|ashby), slug.
# `priority: true` marks companies that get highlighted in the report
# regardless of score.
#
# How to find the slug:
#   Greenhouse: https://boards.greenhouse.io/<slug>
#   Lever:      https://jobs.lever.co/<slug>
#   Ashby:      https://jobs.ashbyhq.com/<slug>
#
# Slugs that 404 or return zero are skipped silently. Run
# `.venv/bin/python -m job_scan probe <ats> <slug>` to test a new entry
# before committing it.

priority:
  - { name: Anthropic,   ats: greenhouse, slug: anthropic }
  - { name: Vercel,      ats: greenhouse, slug: vercel }
  - { name: Linear,      ats: ashby,      slug: linear }
  - { name: Supabase,    ats: ashby,      slug: supabase }
  - { name: Ramp,        ats: ashby,      slug: ramp }

