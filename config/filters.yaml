# Pre-LLM filters. Cheap keyword/location checks that drop obvious
# misses before we spend Gemma time on them.

# Title must match at least one of these (case-insensitive substring).
title_include:
  - software engineer
  - full stack
  - full-stack
  - fullstack
  - backend
  - back-end
  - frontend
  - front-end
  - web engineer
  - applications engineer
  - product engineer
  - platform engineer
  # Enterprise/institutional employers (insurers, hospitals, gov, local NJ
  # shops) title roles "Developer", not "Engineer".
  - software developer
  - web developer
  - application developer
  - applications developer
  - java developer
  - .net developer
  - python
  - typescript
  - react

# Title must NOT match any of these (case-insensitive substring).
# Tuned for ~5 years experience: senior still in range, staff/principal/+ out.
title_exclude:
  # Internships only — they generally require active student enrollment and are
  # temporary. "new grad" / entry-level / junior full-time roles are NOT
  # excluded: the candidate is open to any level (actively job-searching).
  - intern
  - internship

  # IC levels above target. "staff" alone catches "Staff Software Engineer",
  # "Senior Staff Software Engineer", etc.; "staff engineer" alone misses
  # them because there's a word between.
  - principal
  - staff
  - distinguished

  # management — broad coverage. "manager" substring catches "Manager,
  # Software Engineering", "Senior Manager", "Engineering Manager",
  # "Analytics Manager"; "director" catches "Director, Software Engineering";
  # "vp" requires care (could hit "vpn" — unusual in job titles).
  - manager
  - director
  - vp of
  - vp,
  - vp engineering
  - vice president
  - head of
  - tech lead

  # non-engineering pretending to be engineering. "analyst" catches
  # Affirm-style "Analyst I, Full Stack". Note: "analytics" is *not* a
  # substring of "analyst" so legit "Software Engineer, Analytics Platform"
  # roles still pass.
  - analyst
  - analytics lead
  - sales engineer
  - solutions engineer
  - field engineer
  - support engineer
  - customer engineer
  - prompt engineer

  # specialization out of scope for a generalist full-stack profile
  - security engineer
  - data engineer
  - ml engineer
  - machine learning engineer
  - research engineer
  - devops
  - sre
  - site reliability
  - hardware
  - firmware
  - embedded
  - ios
  - android engineer
  - mobile engineer

# Location must match at least one (case-insensitive substring).
# Leave list empty to accept all locations.
location_include:
  - remote
  - united states
  - usa
  - new york
  - nyc
  - new jersey
  - pittsburgh
  - philadelphia
  - boston
  - chatham
  - hybrid

# Location must NOT match any of these.
location_exclude:
  - "remote - emea"
  - "remote - europe"
  - "remote - apac"
  - "remote - latam"
  - "remote - india"

# Hosts dropped regardless of which aggregator surfaced them. freehire is a good
# source overall (Lazarus, QuoteWell, Ledgebrook, Precisely and Xplor all came
# through it) but it republishes boards that are not worth reading.
# himalayas.app: 27 postings seen, scores up to 100, ZERO ever applied to. High
# scores, no conversion, and the site is oriented toward selling its own
# services. Dropped 2026-09-16.
blocked_domains:
  - himalayas.app
  # Click-out aggregators that freehire republishes. Neither hosts the job: the
  # link is an affiliate redirect (whatjobs uses /pub_api__cpl__<id>__7065) that
  # deposits you on whoever actually posted it, so the listing is second-hand and
  # often a duplicate of one already reachable directly.
  # Measured 2026-09-28 over postings first seen since 2026-08-31:
  #   whatjobs.com  472 postings, 77 at 85+, 15 at 95+, 1 visited, 0 APPLIED
  #   adzuna.com     50 postings, 21 at 85+,  8 at 95+, 0 visited, 1 applied
  #   everything else 3,817 postings, 115 applied
  # Cost of this block: the one adzuna application (Sound Decisions, 2026-09-19)
  # existed ONLY via adzuna and whatjobs, so it would not have been surfaced.
  - whatjobs.com
  - adzuna.com

# Companies dropped before scoring, matched as case-insensitive substrings of
# the posting's company name. These are not employers: they score 100 because
# their text is a skills checklist with no team, product or requirement to
# penalize, and they never convert. Measured 2026-11-02 over postings scored
# 90+ in the previous 75 days.
blocked_companies:
  # Talent marketplaces: you submit a profile and they shop it. Fonzi alone was
  # 73 postings at 100 from 10 descriptions, reposted almost daily on LinkedIn
  # since 2026-09-25, 0 applied.
  - fonzi
  - yara ai
  - wrkmark
  - mobina
  - lemon.io
  - underdog
  - huzzle            # sales staffing marketplace, not even engineering
  - hiredbuddy        # "entry-level, remote, apply today" lead-gen front
  # AI data-labeling and model-evaluation gig work: part-time, paid per task.
  - opentrain
  - turing            # current postings are all "help evaluate AI systems"
  - 24-mag
  - yo ai labs
  - invisible technologies
  - dataannotation
  - codeforai
  - remotejobsone     # micro1 "human data platforms" text, republished
  - pro integrate     # same micro1 text under another name
  # Reposters with no conversion. Raydar: 93 postings, 66 at 90+, 0 applied,
  # every one "recruiting on behalf of our client" via freehire.
  - raydar
