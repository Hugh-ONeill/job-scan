# job-scan settings

resume_path: ~/Downloads/Resume.pdf

# Ollama model used for matching. Reuses your local Gemma.
ollama:
  host: http://localhost:11434
  # 26b-a4b MoE: ~4B active params, much faster for batch scoring than the
  # dense 31B and fits comfortably in 24 GB. Swap to 31b-it for higher quality
  # if you have the VRAM free.
  model: gemma4:26b-a4b-it-q4_K_M
  # request timeout in seconds (matching is the slowest step)
  timeout: 180

# Match scoring threshold (0-100). Postings below this are stored as
# "seen" but not surfaced in the report. Raise to be more selective.
min_score: 60

# Drop stale postings. A post with a known date older than this is skipped at
# scan time; the dashboard also hides anything older than this (by post date,
# or by how long we've been seeing it on the board). 0 disables. Tune to taste.
max_age_days: 90

# How the LLM's sub-scores are combined into the final 0-100 number.
# The model rates skill_fit / seniority_fit / domain_fit (0-100) and picks a
# location_tier (1-4); everything below is applied deterministically in Python:
#
#   base  = skill_fit
#           * (seniority_floor + (1-seniority_floor)*seniority_fit/100)   # gate
#           * (domain_floor    + (1-domain_floor)   *domain_fit/100)      # gate
#   final = clamp(base + location_points[tier] + interview_points)
#
# Posting age is NOT scored — it's a sort dimension only. The report and
# dashboard already order by date within a score, so scoring freshness too
# double-counted it and saturated the top into an undifferentiated wall of 100s.
scoring:
  # skill_fit is the capability base; seniority and domain are multiplicative
  # gates. A role the candidate can't plausibly be hired into (seniority_fit
  # low, e.g. asking 8+ years) keeps only this fraction of the score, so it's
  # capped instead of washed out by a high skill_fit. Lower = harsher demotion
  # of over-leveled roles.
  seniority_floor: 0.35
  # An out-of-scope specialization (domain_fit=0) still keeps this fraction.
  # Lower = harsher demotion for ML/security/SRE/embedded/mobile.
  domain_floor: 0.45
  # Points added per location tier (see location_preference below for tiers).
  location_points:
    1: 8     # fully remote (US / anywhere-incl-US)
    2: 7     # explicit relocation package or visa sponsorship
    3: 6     # commutable in NJ (northern/central NJ, Jersey City, Newark, ...)
    4: 5     # commutable NYC metro / Manhattan
    5: 4     # commutable Philadelphia
    6: 0     # US in-office elsewhere, no relocation language (neutral)
    7: -6    # explicitly no relocation/visa, or international w/o sponsorship

# Free-text location preference used to nudge the LLM score.
# Hard include/exclude rules still live in filters.yaml — this is the
# *preference* that shapes the soft score within whatever passes filters.
location_preference: |
  Candidate is currently based in central New Jersey and IS willing to
  relocate anywhere for the right role. However, many employers do NOT
  cover relocation, so practical fit depends on whether the role removes
  the relocation logistics burden. Pick the SINGLE best-matching tier
  number (1-7) for the posting's location + any relocation/visa language.

  Tier 1 — Fully remote (US, or anywhere-including-US).

  Tier 2 — Any location where the posting EXPLICITLY mentions relocation
    assistance, a relocation package, "we'll relocate the right candidate,"
    or visa sponsorship. The employer removing the logistics burden is the
    strongest non-remote signal.

  Tier 3 — In-office or hybrid commutable WITHIN New Jersey: central/
    northern NJ, Jersey City, Newark, Hoboken, Chatham. (No commute over a
    state line — the easiest day-to-day.)

  Tier 4 — In-office or hybrid in the NYC metro / Manhattan.

  Tier 5 — In-office or hybrid in Philadelphia.

  Tier 6 — Neutral. US-based in-office in another city with NO relocation
    language either way (SF, Seattle, Austin, Chicago, Boston, DC,
    Pittsburgh, LA, Denver, etc.). The candidate could move but self-funds.

  Tier 7 — Negative. The posting EXPLICITLY states no relocation and no visa
    sponsorship, OR it is an international in-office role with no sponsorship
    mentioned (the candidate cannot take it without a visa).

  Do NOT penalize the candidate for unwillingness to move — they ARE
  willing. Only Tier 7 is a penalty, and only when the employer's stance
  makes the logistics impossible or explicitly unsupported.

# Cross-company aggregators — surface jobs from companies NOT in companies.yaml.
# These flow through the same title/location filters and scoring as everything
# else. Disable any source by setting it to false. Skip all with `run --no-aggregators`.
aggregators:
  hackernews: true        # monthly "Ask HN: Who is hiring?" thread
  remoteok: true          # remoteok.com/api (remote)
  remotive: true          # remotive.com remote jobs
  weworkremotely: true    # WWR programming RSS feeds (thin descriptions)
  # Search terms for sources with server-side search (Remotive). Other sources
  # are filtered by the title rules in filters.yaml.
  queries:
    - software engineer
    - full stack
    - backend
    - frontend
  # Cap postings pulled per source per run (keeps the daily scoring load sane).
  max_per_source: 200

# Top N matches highlighted at the top of the report and in notify-send.
top_n: 10

# notify-send urgency: low, normal, critical
notify_urgency: normal

# Hard cap on postings scored per run, to keep daily runtime reasonable.
# New unseen postings beyond this cap are deferred to the next run.
# 150 @ ~20s/posting once Gemma is warm is ~50min worst case.
max_score_per_run: 150
