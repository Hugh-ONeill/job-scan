[project]
name = "job-scan"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pypdf>=6.12.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.scripts]
job-scan = "job_scan.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scan"]
