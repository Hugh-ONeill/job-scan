<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>job-scan dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Daily scan of job postings scored against a resume, with an application pipeline.">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>job-scan</h1>
  <div id="stats" class="stats"></div>
</header>

<section class="controls">
  <label>
    Min score
    <input type="number" id="min-score" value="60" min="0" max="100" step="5">
  </label>
  <label>
    Show top
    <input type="number" id="top-per-company" value="2" min="1" max="20" step="1">
    per company
  </label>
  <label>
    Sort
    <select id="sort-mode">
      <option value="score">Score, then date</option>
      <option value="date">Date, then score</option>
    </select>
  </label>
  <fieldset class="status-filter">
    <legend>Show</legend>
    <label><input type="checkbox" value="pending"   checked> Pending</label>
    <label><input type="checkbox" value="visited"   checked> Visited</label>
    <label><input type="checkbox" value="applied"   checked> Applied</label>
    <label><input type="checkbox" value="dismissed">         Dismissed</label>
  </fieldset>
  <label class="search-label">
    Search
    <input type="search" id="q" placeholder="company, title, location, words…">
  </label>
</section>

<section class="group picks" id="picks" hidden>
  <header class="group-head">
    <h2 class="group-name" id="picks-title">Today's three</h2>
    <span class="group-meta" id="picks-meta"></span>
  </header>
  <div class="group-rows" id="picks-rows"></div>
</section>

<section class="pipeline" id="pipeline" hidden>
  <header class="pipeline-head">
    <h2>Applications</h2>
    <span id="pipeline-summary" class="muted"></span>
    <button class="btn" id="pipeline-resolved-toggle" type="button" hidden></button>
    <button class="btn" id="pipeline-toggle" type="button">Hide</button>
  </header>
  <div id="pipeline-body">
    <table class="pipeline-table">
      <thead>
        <tr>
          <th>Company</th><th>Role</th><th>Status</th><th>Applied</th>
          <th>Quiet</th><th>Follow-ups</th><th>Notes</th>
        </tr>
      </thead>
      <tbody id="pipeline-rows"></tbody>
    </table>
  </div>
</section>

<main id="groups">
  <p class="empty">Loading…</p>
</main>

<template id="group-template">
  <section class="group">
    <header class="group-head">
      <h2 class="group-name"></h2>
      <span class="group-meta"></span>
      <button class="btn group-toggle" hidden>Show all</button>
    </header>
    <div class="group-rows"></div>
  </section>
</template>

<template id="posting-template">
  <div class="posting">
    <button class="posting-head" type="button">
      <span class="score"></span>
      <span class="posting-title"></span>
      <span class="posting-meta"></span>
      <span class="status-tag"></span>
    </button>
    <div class="detail" hidden>
      <p class="rationale"></p>
      <div class="two-col">
        <div class="strengths">
          <h3>Strengths</h3>
          <ul></ul>
        </div>
        <div class="concerns">
          <h3>Concerns</h3>
          <ul></ul>
        </div>
      </div>
      <details class="description">
        <summary>Full posting description</summary>
        <div class="description-body"></div>
      </details>
      <div class="actions">
        <a class="btn primary apply" target="_blank" rel="noopener">Apply →</a>
        <button class="btn mark-applied" type="button">Mark applied</button>
        <button class="btn dismiss" type="button">Dismiss</button>
        <button class="btn reset" type="button">Reset to pending</button>
      </div>
    </div>
  </div>
</template>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
